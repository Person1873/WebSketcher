<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchTool</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      #loading { display:flex; align-items:center; justify-content:center;
        height:100%; color:#5080a0; font-family:monospace; font-size:14px; }
    </style>
    <!-- Vendored locally — no CDN, no Node required. Run with: ./serve.sh -->
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./vendor/babel.min.js"></script>
  </head>
  <body>
    <div id="root"><div id="loading">Loading SketchTool…</div></div>
    <script>
      // Provide a require() shim so Babel's CJS transform can resolve imports
      window.__require = function(name) {
        if (name === 'react')            return window.React;
        if (name === 'react-dom')        return window.ReactDOM;
        if (name === 'react-dom/client') return { createRoot: window.ReactDOM.createRoot };
        throw new Error('Unknown module: ' + name);
      };
    </script>
    <script type="module">
      // Load planegcs (FreeCAD's constraint solver WASM) first.
      // Exposed as window.__planegcs so SketchTool.jsx can use it synchronously.
      try {
        const { init_planegcs_module, GcsWrapper } =
          await import('./vendor/planegcs/index.js');
        const mod = await init_planegcs_module({
          locateFile: () => './vendor/planegcs/planegcs_dist/planegcs.wasm',
        });
        window.__planegcs = { mod, GcsWrapper };
        console.log('[planegcs] solver ready');
      } catch(e) {
        window.__planegcs = null;
        window.__planegcsError = e.message;
        console.warn('[planegcs] unavailable, using Gauss-Seidel fallback:', e.message);
      }

      // Fetch SketchTool.jsx, transform JSX + ES imports → CJS via Babel,
      // execute with the require shim, then mount.
      const src = await fetch('./SketchTool.jsx').then(r => r.text());

      const { code } = Babel.transform(src, {
        presets:  ['react'],
        plugins:  ['transform-modules-commonjs'],
        filename: 'SketchTool.jsx',
      });

      const mod = { exports: {} };
      new Function('require', 'module', 'exports', code)(
        window.__require, mod, mod.exports
      );

      const SketcherApp = mod.exports.default ?? mod.exports.SketcherApp;
      const { createRoot } = window.ReactDOM;
      createRoot(document.getElementById('root'))
        .render(React.createElement(SketcherApp));
    </script>
  </body>
</html>
